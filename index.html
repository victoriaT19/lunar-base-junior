<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <title>Lunar Base Junior</title>
    <link rel="stylesheet" href="css/style.css?v=6" />
  </head>
  <body>
    <div id="wrap">
      <div id="stage">
        <canvas id="cv" width="1920" height="1080"></canvas>
        <div class="hud" id="bars"></div>
        <div class="hud" id="info"></div>
        <div class="hud" id="banners"></div>
        <div class="hud" id="toast"></div>
        <div id="pal"></div>
        <div id="bar">
          <button data-a="eat">🍲 Eat</button>
          <button data-a="sleep">😴 Sleep</button>
          <button data-a="pet">🤖 Hi KAI</button>
          <button data-a="missions">🎯 Missions</button>
          <button data-a="craft">🔧 Craft</button>
          <button data-a="build" id="bBuild">🧱 Build</button>
          <button data-a="style">🎨 Style</button>
          <button data-a="exp">🚀 Expedition</button>
          <button data-a="a11y" class="alt" aria-label="Accessibility settings">♿ Access</button>
          <button data-a="wx" class="alt">📡 Space weather</button>
          <button data-a="story" class="alt">📖 Story</button>
          <button data-a="snd" class="alt" id="bSnd" aria-label="Toggle sound">🔊</button>
        </div>

        <div id="sr" class="sr-only" aria-live="polite" aria-atomic="true"></div>
        <div class="overlay on" id="ovTitle"><div class="modal" id="titleBox"></div></div>
        <div class="overlay" id="ovPlan"><div class="modal" id="planBox"></div></div>
        <div class="overlay" id="ovMenu"><div class="modal" id="menuBox"></div></div>
        <div class="overlay" id="ovStory"><div class="modal" id="storyBox"></div></div>
        <div class="overlay" id="ovMG">
          <div id="mgBox">
            <div
              style="
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 6px;
              "
            >
              <b id="mgTitle"></b
              ><span
                ><button
                  class="alt"
                  id="mgKai"
                  title="KAI finishes the task, but uses half of your oxygen"
                >
                  🤖 KAI helps (½ oxygen)
                </button>
                <button class="alt" id="mgQuit">Give up</button></span
              >
            </div>
            <canvas id="mg" width="1280" height="840"></canvas>
            <div id="mgHelp" style="color: var(--mut); font-size: 0.85em; margin-top: 6px"></div>
          </div>
        </div>
        <div class="overlay" id="ovEnd"><div class="modal" id="endBox"></div></div>
      </div>
    </div>

    <script src="art/art.js?v=2"></script>
    <script src="js/core.js?v=6"></script>
    <script src="js/data.js?v=6"></script>
    <script src="js/state.js?v=6"></script>
    <script src="js/character.js?v=6"></script>
    <script src="js/hub.js?v=6"></script>
    <script src="js/ui.js?v=6"></script>
    <script src="js/plan.js?v=6"></script>
    <script src="js/minigames.js?v=6"></script>
    <script src="js/mission.js?v=6"></script>
    <script src="js/main.js?v=6"></script>
  </body>
</html>
