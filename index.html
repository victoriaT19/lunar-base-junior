<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <title>Lunar Base Junior</title>
    <style>
      :root {
        --card: #141c46;
        --card2: #1f2a63;
        --txt: #eef2ff;
        --mut: #a9b4e8;
        --acc: #ff9f45;
        --ok: #7bd88f;
        --bad: #ff5d73;
        --warn: #ffd166;
        --blue: #5aa9ff;
        --vio: #b388ff;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        background: #04061a;
        color: var(--txt);
        font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
        height: 100%;
        overflow: hidden;
      }
      #wrap {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #stage {
        position: relative;
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
        background: #000;
        overflow: hidden;
      }
      canvas#cv {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 0;
        border-radius: 10px;
        padding: 7px 12px;
        background: var(--acc);
        color: #1b1200;
        font-weight: bold;
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      button.alt {
        background: var(--card2);
        color: var(--txt);
      }
      button.on {
        background: var(--acc);
        color: #1b1200;
      }
      .hud {
        position: absolute;
        pointer-events: none;
        font-size: clamp(10px, 1.5vw, 14px);
        text-shadow: 0 1px 3px #000;
      }
      #bars {
        left: 1.2%;
        top: 1.8%;
        width: 25%;
        min-width: 150px;
      }
      .bar {
        margin-bottom: 0.7vw;
      }
      .bar b {
        display: flex;
        justify-content: space-between;
        font-size: 0.9em;
      }
      .bt {
        height: 0.9vw;
        min-height: 7px;
        background: rgba(0, 0, 10, 0.6);
        border-radius: 6px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      .bt i {
        display: block;
        height: 100%;
        transition: width 0.2s;
      }
      .bar.low {
        animation: bl 0.7s infinite;
      }
      @keyframes bl {
        50% {
          opacity: 0.4;
        }
      }
      #info {
        right: 1.2%;
        top: 1.8%;
        width: 30%;
        min-width: 170px;
        background: rgba(10, 16, 48, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        padding: 0.7vw 1vw;
      }
      #info small {
        color: var(--mut);
      }
      #banners {
        left: 50%;
        top: 1.8%;
        transform: translateX(-50%);
        text-align: center;
        width: 36%;
        pointer-events: none;
      }
      #banners div {
        border-radius: 10px;
        padding: 0.5vw 1vw;
        margin-bottom: 0.4vw;
        font-weight: bold;
        pointer-events: auto;
      }
      .wc {
        background: rgba(150, 20, 45, 0.92);
        animation: bl 0.6s infinite;
      }
      .ww {
        background: rgba(120, 90, 10, 0.92);
      }
      #banners button {
        margin-left: 6px;
        padding: 3px 8px;
        font-size: 0.9em;
      }
      #toast {
        left: 50%;
        bottom: 15%;
        transform: translateX(-50%);
        width: 60%;
        text-align: center;
      }
      #toast div {
        background: rgba(10, 16, 48, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 10px;
        padding: 0.5vw 1vw;
        margin-top: 0.3vw;
      }
      #bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 0.6% 1%;
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
        justify-content: center;
        background: linear-gradient(transparent, rgba(3, 6, 24, 0.95) 40%);
      }
      #bar button {
        font-size: clamp(10px, 1.4vw, 14px);
        padding: 0.6vw 0.9vw;
      }
      #pal {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 8.5%;
        display: none;
        gap: 5px;
        flex-wrap: wrap;
        justify-content: center;
        padding: 0 2%;
      }
      #pal.on {
        display: flex;
      }
      #pal button {
        background: var(--card2);
        color: var(--txt);
        font-size: clamp(9px, 1.2vw, 12px);
        padding: 0.4vw 0.7vw;
        text-align: left;
        line-height: 1.2;
      }
      #pal button.on {
        outline: 3px solid var(--acc);
        background: #2d3a85;
      }
      #pal small {
        display: block;
        color: var(--mut);
        font-weight: normal;
      }
      .overlay {
        position: absolute;
        inset: 0;
        background: rgba(3, 6, 24, 0.92);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 2%;
        z-index: 10;
      }
      .overlay.on {
        display: flex;
      }
      .modal {
        background: var(--card);
        border-radius: 16px;
        max-width: 860px;
        width: 100%;
        max-height: 96%;
        overflow: auto;
        padding: 16px 18px;
        font-size: clamp(11px, 1.6vw, 15px);
      }
      .modal h2 {
        margin: 0 0 8px;
      }
      .modal li {
        margin: 5px 0;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        background: var(--card2);
        border-radius: 10px;
        padding: 7px 10px;
        margin: 5px 0;
      }
      .row small {
        color: var(--mut);
        display: block;
      }
      .tabs {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .inv {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .inv span {
        background: var(--card2);
        border-radius: 8px;
        padding: 4px 8px;
        font-size: 0.9em;
      }
      .sw {
        display: inline-block;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        margin: 3px;
        border: 3px solid transparent;
        cursor: pointer;
        vertical-align: middle;
      }
      .sw.on {
        border-color: #fff;
      }
      input[type="text"] {
        font: inherit;
        background: var(--card2);
        color: var(--txt);
        border: 0;
        border-radius: 8px;
        padding: 7px;
        width: 180px;
      }
      .real {
        background: #0a0e2a;
        border-left: 4px solid var(--blue);
        border-radius: 8px;
        padding: 8px 10px;
        margin: 10px 0;
        color: var(--mut);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9em;
      }
      td,
      th {
        padding: 5px 7px;
        border-bottom: 1px solid #2b3680;
        text-align: left;
        vertical-align: top;
      }
      th {
        color: var(--warn);
      }
      a {
        color: #8fd3ff;
      }
      .ok {
        color: var(--ok);
      }
      .no {
        color: var(--bad);
      }
      #mgBox {
        background: var(--card);
        border-radius: 16px;
        padding: 12px;
        max-width: 700px;
        width: 100%;
      }
      #mg {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 10px;
        background: #0a0e2a;
        touch-action: none;
      }
      .plan {
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        gap: 12px;
      }
      .pc {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        background: var(--card2);
        border-radius: 10px;
        padding: 7px 10px;
        margin: 5px 0;
        cursor: pointer;
        border: 2px solid transparent;
      }
      .pc.sel {
        border-color: var(--ok);
        background: #243a6a;
      }
      .pc.lock {
        opacity: 0.85;
        cursor: default;
        border-color: #3a4685;
      }
      .pc small {
        display: block;
        color: var(--mut);
      }
      .pc .kg {
        margin-left: auto;
        white-space: nowrap;
        color: var(--warn);
        font-weight: bold;
      }
      .sum {
        background: #0a0e2a;
        border-radius: 12px;
        padding: 10px;
        position: sticky;
        top: 0;
      }
      .massbar {
        height: 16px;
        background: #12183f;
        border-radius: 8px;
        overflow: hidden;
        margin: 6px 0;
      }
      .massbar i {
        display: block;
        height: 100%;
      }
      .sum div.l {
        display: flex;
        justify-content: space-between;
        margin: 3px 0;
      }
      .catgrid h3 {
        margin: 10px 0 2px;
        color: var(--warn);
      }
      @media (max-width: 820px) {
        .plan {
          grid-template-columns: 1fr;
        }
      }

      :root {
        --card: #0a1034;
        --card2: #13206a;
        --txt: #eef2ff;
        --mut: #9fb0ff;
        --acc: #ff8c1a;
        --ok: #35c46a;
        --bad: #ff4d6d;
        --warn: #ffd23f;
        --gold: #ffd23f;
        --teal: #6fe3ff;
        --pb: #24379f;
      }
      html,
      body {
        font-family: "VT323", "Courier New", monospace;
      }
      * {
        border-radius: 0 !important;
      }
      canvas#cv,
      #mg,
      .prev,
      .pix canvas,
      .ico,
      .scard canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      h2,
      h3,
      button,
      .ctitle,
      .olbl,
      .clbl,
      .hud b {
        font-family: "Press Start 2P", "VT323", monospace;
        letter-spacing: 0;
      }
      .modal {
        max-width: 1100px;
        font-size: clamp(15px, 2.1vw, 21px);
        border: 4px solid var(--pb);
        box-shadow:
          0 0 0 4px #000,
          10px 10px 0 4px rgba(0, 0, 0, 0.55);
        background: #070b24;
      }
      .modal h2 {
        font-size: 0.8em;
        color: var(--gold);
        line-height: 1.5;
      }
      .modal h3 {
        font-size: 0.6em;
        color: var(--teal);
        line-height: 1.5;
      }
      button {
        font-size: 0.55em;
        line-height: 1.4;
        padding: 9px 10px;
        border: 3px solid #000;
        box-shadow:
          inset -3px -3px 0 rgba(0, 0, 0, 0.35),
          inset 3px 3px 0 rgba(255, 255, 255, 0.28),
          3px 3px 0 #000;
        text-transform: uppercase;
      }
      button:hover:not(:disabled) {
        filter: brightness(1.12);
      }
      button:active:not(:disabled) {
        transform: translate(2px, 2px);
        box-shadow:
          inset 3px 3px 0 rgba(0, 0, 0, 0.35),
          1px 1px 0 #000;
      }
      #bar button {
        font-size: clamp(7px, 0.9vw, 10px);
      }
      .hud {
        font-family: "VT323", monospace;
        font-size: clamp(13px, 1.9vw, 19px);
      }
      .hud b {
        font-size: 0.6em;
      }
      .bt {
        border: 2px solid #000 !important;
      }
      #info {
        border: 3px solid var(--pb) !important;
        box-shadow: 0 0 0 3px #000;
        background: rgba(7, 11, 36, 0.92);
      }
      .row,
      .pc,
      .sum,
      .inv span,
      .lv {
        border: 3px solid var(--pb);
      }
      .overlay {
        background: rgba(2, 4, 16, 0.94);
      }
      #toast div {
        border: 3px solid var(--pb);
        box-shadow: 0 0 0 2px #000;
        background: #070b24;
      }
      .wc {
        background: #9a1a35;
        border: 3px solid #000;
      }
      .ww {
        background: #8a6a10;
        border: 3px solid #000;
      }
      input[type="text"] {
        font-family: "VT323", monospace;
        font-size: 1.1em;
        border: 3px solid var(--pb);
        background: #0a1034;
        color: #fff;
      }
      button:focus-visible,
      input:focus-visible,
      .pc:focus-visible,
      .lv:focus-visible {
        outline: 4px solid var(--gold);
        outline-offset: 2px;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }
      .crx {
        display: grid;
        grid-template-columns: 250px 1fr 250px;
        gap: 12px;
      }
      .cpanel {
        border: 4px solid var(--pb);
        box-shadow: 0 0 0 3px #000;
        background: #080d2c;
        padding: 10px;
        min-width: 0;
      }
      .ctitle {
        font-size: 0.62em;
        color: #fff;
        text-align: center;
        line-height: 1.6;
      }
      .ctitle.gold {
        color: var(--gold);
        margin: 4px 0 6px;
      }
      .csub {
        color: var(--teal);
        text-align: center;
        margin: 4px 0 8px;
        line-height: 1;
      }
      .prev {
        display: block;
        width: 100%;
        height: auto;
        border: 3px solid #000;
      }
      .gbtns {
        display: flex;
        gap: 8px;
        margin: 10px 0;
      }
      .gb {
        flex: 1;
        font-size: 0.55em;
        color: #fff;
      }
      .gb.boy {
        background: #2a6fe0;
      }
      .gb.girl {
        background: #8a3be0;
      }
      .gb.on {
        outline: 3px solid var(--gold);
        outline-offset: 1px;
      }
      .cbox {
        border: 3px solid var(--pb);
        padding: 8px;
        background: #0a1034;
      }
      .clbl {
        font-size: 0.5em;
        color: #fff;
        text-align: center;
        margin-bottom: 8px;
      }
      .nrow {
        display: flex;
        gap: 6px;
      }
      .nrow input {
        flex: 1;
        min-width: 0;
        width: auto;
      }
      .dice {
        background: #d98a1a;
        padding: 4px 8px;
        font-size: 0.9em;
      }
      .go {
        display: block;
        width: 100%;
        margin-top: 10px;
        background: #35c46a;
        color: #fff;
        font-size: 0.6em;
        padding: 14px 8px;
      }
      .opt {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 7px 0;
        border-top: 3px solid #141f63;
      }
      .opt:first-child {
        border-top: 0;
      }
      .ico {
        width: 40px;
        height: 40px;
        flex: none;
        border: 3px solid var(--pb);
        background: #0a1034;
      }
      .ob {
        flex: 1;
        min-width: 0;
      }
      .olbl {
        font-size: 0.48em;
        color: var(--teal);
        margin: 2px 0 6px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .pix {
        padding: 2px;
        width: 50px;
        height: 50px;
        background: #0a1034;
        border: 3px solid #26348f;
        box-shadow: none;
      }
      .pix canvas {
        width: 40px;
        height: 40px;
        display: block;
      }
      .pix.on {
        border-color: var(--gold);
        background: #1a2470;
      }
      .swb {
        width: 32px;
        height: 32px;
        padding: 0;
        border: 3px solid #26348f;
        box-shadow: none;
      }
      .swb.on {
        border-color: var(--gold);
        outline: 2px solid #000;
      }
      .swb.orig {
        background: #0a1034;
        color: var(--gold);
        font-size: 14px;
      }
      .scard {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        margin: 8px 0;
        padding: 4px;
        text-align: left;
        border: 4px solid var(--sc);
        background: linear-gradient(90deg, var(--sbg), #080d2c 75%);
        box-shadow: 0 0 0 3px #000;
        text-transform: none;
      }
      .scard canvas {
        width: 78px;
        height: 78px;
        flex: none;
      }
      .scard b {
        display: block;
        color: var(--sc);
        font-size: 1em;
        margin-bottom: 6px;
        text-transform: uppercase;
      }
      .scard small {
        display: block;
        color: #fff;
        font-family: "VT323", monospace;
        font-size: 1.7em;
        line-height: 1;
      }
      .scard.on {
        background: linear-gradient(90deg, var(--sbg), #080d2c 75%) !important;
        outline: 3px solid var(--gold);
        outline-offset: 2px;
      }
      .cfoot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
        color: var(--teal);
        flex-wrap: wrap;
      }
      .cfoot span {
        color: var(--mut);
      }
      .lvs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin: 8px 0;
      }
      .lv {
        background: #0a1034;
        padding: 8px;
        cursor: pointer;
      }
      .lv.sel {
        border-color: var(--gold);
        background: #16227a;
      }
      .lv b {
        display: block;
        font-family: "Press Start 2P", monospace;
        font-size: 0.5em;
        color: var(--gold);
        line-height: 1.6;
        margin-bottom: 4px;
      }
      .lv small {
        color: var(--txt);
        display: block;
        line-height: 1.05;
      }
      body.hc {
        --card: #000;
        --card2: #0e0e26;
        --txt: #fff;
        --mut: #fff;
      }
      body.hc .modal,
      body.hc .row,
      body.hc .pc,
      body.hc .sum,
      body.hc #info,
      body.hc .cpanel {
        border-color: #fff !important;
      }
      body.hc button {
        border-color: #fff;
      }
      body.hc .hud {
        text-shadow:
          0 0 3px #000,
          0 0 3px #000;
      }
      body.big .modal {
        font-size: clamp(17px, 2.4vw, 24px);
      }
      body.big .hud {
        font-size: clamp(15px, 2.2vw, 22px);
      }
      body.big #bar button {
        font-size: clamp(9px, 1.1vw, 12px);
      }
      body.rm *,
      body.rm *::before {
        animation: none !important;
        transition: none !important;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
      @media (max-width: 860px) {
        .crx {
          grid-template-columns: 1fr;
        }
        .lvs {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="stage">
        <canvas id="cv" width="480" height="270"></canvas>
        <div class="hud" id="bars"></div>
        <div class="hud" id="info"></div>
        <div class="hud" id="banners"></div>
        <div class="hud" id="toast"></div>
        <div id="pal"></div>
        <div id="bar">
          <button data-a="eat">🍲 Eat</button>
          <button data-a="sleep">😴 Sleep</button>
          <button data-a="pet">🤗 Pet</button>
          <button data-a="missions">🎯 Missions</button>
          <button data-a="craft">🔧 Craft</button>
          <button data-a="build" id="bBuild">🧱 Build</button>
          <button data-a="style">🎨 Style</button>
          <button data-a="exp">🚀 Expedition</button>
          <button data-a="a11y" class="alt" aria-label="Accessibility settings">♿ Access</button>
          <button data-a="wx" class="alt">📡 Space weather</button>
          <button data-a="story" class="alt">📖 Story</button>
          <button data-a="snd" class="alt" id="bSnd" aria-label="Toggle sound">🔊</button>
        </div>

        <div id="sr" class="sr-only" aria-live="polite" aria-atomic="true"></div>
        <div class="overlay on" id="ovTitle"><div class="modal" id="titleBox"></div></div>
        <div class="overlay" id="ovPlan"><div class="modal" id="planBox"></div></div>
        <div class="overlay" id="ovMenu"><div class="modal" id="menuBox"></div></div>
        <div class="overlay" id="ovStory"><div class="modal" id="storyBox"></div></div>
        <div class="overlay" id="ovMG">
          <div id="mgBox">
            <div
              style="
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 6px;
              "
            >
              <b id="mgTitle"></b><button class="alt" id="mgQuit">Give up</button>
            </div>
            <canvas id="mg" width="640" height="420"></canvas>
            <div id="mgHelp" style="color: var(--mut); font-size: 0.85em; margin-top: 6px"></div>
          </div>
        </div>
        <div class="overlay" id="ovEnd"><div class="modal" id="endBox"></div></div>
      </div>
    </div>

    <script src="art/art.js"></script>
    <script>
      const W = 960,
        H = 540,
        CELL = 56,
        GX = 32,
        GY = 84,

          const w = ctx.measureText(R.bub).width + 22;
          const bxp = clamp(R.x - w / 2, GX + 2 * CELL, GX + 14 * CELL - w),
            byp = FLOORY - 206;
          ctx.fillStyle = "#fff";
          ctx.beginPath();
          ctx.roundRect(bxp, byp, w, 28, 10);
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(R.x - 6, byp + 28);
          ctx.lineTo(R.x, byp + 38);
          ctx.lineTo(R.x + 6, byp + 28);
          ctx.fill();
          ctx.fillStyle = "#1b2468";
          ctx.textAlign = "left";
          ctx.fillText(R.bub, bxp + 11, byp + 19);
        }
        R.hearts.forEach((h) => {
          ctx.globalAlpha = Math.min(1, h.l * 2);
          ctx.font = "22px serif";
          ctx.textAlign = "center";
          ctx.fillText(h.e, h.x, h.y);
        });
        ctx.globalAlpha = 1;
        if (R.build) {
          ctx.strokeStyle = "rgba(255,255,255,.18)";
          ctx.lineWidth = 1;
          for (let r = 0; r <= 7; r++) {
            ctx.beginPath();
            ctx.moveTo(GX, GY + r * CELL);
            ctx.lineTo(GX + GC * CELL, GY + r * CELL);
            ctx.stroke();
          }
          for (let c = 0; c <= GC; c++) {
            ctx.beginPath();
            ctx.moveTo(GX + c * CELL, GY);
            ctx.lineTo(GX + c * CELL, GY + 7 * CELL);
            ctx.stroke();
          }
          if (R.hover) {
            const [c, r] = R.hover;
            if (c >= 0 && c < GC && r >= 0 && r < 7) {
              const [bx, by] = blockXY(c, r);
              if (R.tool.startsWith("mod:")) {
                const m = MODS[R.tool];
                const okm = canPlaceMod(c, r, m).ok;
                m.cells.forEach((x) => {
                  const [qx, qy] = blockXY(c + x[0], r + x[1]);
                  ctx.fillStyle = okm ? "rgba(123,216,143,.35)" : "rgba(255,93,115,.35)";
                  ctx.fillRect(qx, qy, CELL, CELL);
                  ctx.globalAlpha = 0.7;
                  drawBlock(ctx, x[2], qx, qy, t);
                  ctx.globalAlpha = 1;
                });
              } else {
                const ok = canPlace(c, r, R.tool).ok;
                ctx.fillStyle = ok ? "rgba(123,216,143,.35)" : "rgba(255,93,115,.35)";
                ctx.fillRect(bx, by, CELL, CELL);
                if (R.tool !== "erase") {
                  ctx.globalAlpha = 0.7;
                  drawBlock(ctx, R.tool, bx, by, t);
                  ctx.globalAlpha = 1;
                }
              }
            }
          }
        }
        const st = R.storm;
        if (st.state === 2) {
          ctx.fillStyle = "rgba(255,150,30,.12)";
          ctx.fillRect(0, 0, W, H);
          ctx.strokeStyle = "rgba(255,210,90,.8)";
          ctx.lineWidth = 2;
          for (let i = 0; i < 30; i++) {
            const sx = (i * 53 + t * 0.1) % W,
              sy = ((t * 0.8 + i * 41) % GY) * 1.2 + ((i * 17) % GY);
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            ctx.lineTo(sx - 7, sy + 14);
            ctx.stroke();
          }
        }
        if (R.fault || st.state === 1) {
          ctx.fillStyle = `rgba(255,0,40,${0.03 + 0.05 * Math.abs(Math.sin(t / 220))})`;
          ctx.fillRect(0, 0, W, H);
        }
        ctx.textAlign = "left";
      }

      function canPlace(c, r, id) {
        if (c < 0 || c >= GC || r < 0 || r >= 7) return { ok: false, why: "Outside the map." };
        if (isHull(c, r)) return { ok: false, why: "That is the hull." };
        if (RESV.has(c + "," + r))
          return { ok: false, why: "That space is taken by the furniture." };
        const key = c + "," + r;
        if (id === "erase") return { ok: !!S.blocks[key], why: "Nothing to remove." };
        if (S.blocks[key]) return { ok: false, why: "Occupied. Remove it first." };
        const b = BLK[id];
        const exterior = r <= 0 || r === 6 || c <= 0 || c >= 15;
        const interior = r >= 2 && r <= 5 && c >= 2 && c <= 13;
        if (b.ext && !exterior) return { ok: false, why: "This one goes outside." };
        if (!b.ext && !exterior && !interior) return { ok: false, why: "Not here." };
        if (!b.ext && exterior && id !== "brick" && id !== "polymer")
          return { ok: false, why: "Build that inside the base." };
        return { ok: true };
      }
      function cellAt(ev) {
        const r = cv.getBoundingClientRect();
        const x = ((ev.clientX - r.left) / r.width) * W,
          y = ((ev.clientY - r.top) / r.height) * H;
        return { c: Math.floor((x - GX) / CELL), r: Math.floor((y - GY) / CELL), x, y };
      }
      cv.addEventListener("pointermove", (e) => {
        if (R.build) {
          const p = cellAt(e);
          R.hover = [p.c, p.r];
        }
      });
      cv.addEventListener("pointerleave", () => {
        R.hover = null;
      });
      cv.addEventListener("pointerdown", (e) => {
        ensureAudio();
        if (R.paused) return;
        const p = cellAt(e);
        if (R.build) {
          const { c, r } = p;
          const key = c + "," + r;
          if (R.tool === "erase") {
            if (S.blocks[key] && !RESV.has(key)) {
              const b = BLK[S.blocks[key]];
              payCost(b.cost, -1);
              delete S.blocks[key];
              beep(500, 0.06);
              writeSave();
            }
            return;
          }
          if (R.tool.startsWith("mod:")) {
            const m = MODS[R.tool];
            const q = canPlaceMod(c, r, m);
            if (!q.ok) {
              toast(q.why, 1800);
              return;
            }
            const cost = modCost(m);
            if (!afford(cost)) {
              toast("You need " + costTxt(cost) + ".", 2200);
              return;
            }
            payCost(cost, 1);
            m.cells.forEach((x) => {
              S.blocks[c + x[0] + "," + (r + x[1])] = x[2];
            });
            beep(900, 0.07);
            writeSave();
            return;
          }
          const chk = canPlace(c, r, R.tool);
          if (!chk.ok) {
            toast(chk.why, 1800);
            return;
          }
          const b = BLK[R.tool];
          if (!afford(b.cost)) {
            toast("You need " + costTxt(b.cost) + ".", 2200);
            return;
          }
          payCost(b.cost, 1);
          S.blocks[key] = R.tool;
          beep(900, 0.07);
          writeSave();
          return;
        }
        if (Math.abs(p.x - R.x) < 40 && p.y > FLOORY - 170 && p.y < FLOORY + 10) {
          doAct("pet");
          return;
        }
        if (p.y > GY + 2 * CELL && p.y < FLOORY + 5) {
          if (p.x > BEDX - 60 && p.x < BEDX + 60) doAct("sleep");
          else if (p.x > GALX - 60 && p.x < GALX + 60) doAct("eat");
          else if (p.x > CONX - 60 && p.x < CONX + 60) doAct("missions");
          else if (p.x > DOORX - 30) doAct("exp");
        }
      });

      function setBub(m, s) {
        R.bub = m;
        R.bubT = s || 3;
      }
      function doAct(a) {
        ensureAudio();
        if (R.paused && a !== "snd") return;
        if (R.mode === "sleep" || R.mode === "eat" || R.leave > 0) return;
        if (a === "eat") {
          R.act = { t: "eat", x: GALX };
        } else if (a === "sleep") {
          R.act = { t: "sleep", x: BEDX };
        } else if (a === "pet") {
          pet();
        } else if (a === "missions") {
          R.act = { t: "missions", x: CONX };
        } else if (a === "craft") {
          R.act = { t: "craft", x: CONX };
        } else if (a === "exp") {
          if (!mod("airlock")) {
            toast(
              "🚪 Your ship has no airlock, so nobody can go outside. Try the dust maze mission instead.",
              4500,
            );
            setBub("No airlock... we can't go out.", 3);
            return;
          }
          R.act = { t: "exp", x: DOORX };
        } else if (a === "style") {
          openStyle();
        } else if (a === "story") {
          openStory();
        } else if (a === "a11y") {
          openA11y();
        } else if (a === "wx") {
          openWx();
        } else if (a === "build") {
          toggleBuild();
        } else if (a === "snd") {
          muted = !muted;
          $("bSnd").textContent = muted ? "🔇" : "🔊";
          if (!muted) ensureAudio();
        }
        if (R.act && R.build) toggleBuild();
        if (R.act) R.tx = R.act.x;
      }
      function pet() {
        if (R.petCool > 0) return;
        R.petCool = 0.9;
        R.mode = "wave";
        R.mt = 0.9;
        S.needs.mood = Math.min(100, S.needs.mood + 6);
        S.flags.petted = true;
        S.flags.pets = (S.flags.pets || 0) + 1;
        for (let i = 0; i < 4; i++)
          R.hearts.push({
            x: R.x + rnd(-20, 20),
            y: FLOORY - 150,
            vy: -rnd(30, 60),
            l: 1.2,
            e: ["❤️", "💛", "✨"][i % 3],
          });
        beep(1200, 0.08, 0.02);
        setBub(
          ["Hehe, that tickles!", "You're the best!", "Hello, friend!"][
            Math.floor(Math.random() * 3)
          ],
          2,
        );
      }
      function arrive(a) {
        if (a.t === "eat") {
          if (S.rations <= 0) {
            toast("No rations left! Grow plants, craft meal packs or buy rations in Craft.", 3500);
            setBub("I'm out of food...", 3);
            return;
          }
          S.rations--;
          R.mode = "eat";
          R.mt = 1.6;
        } else if (a.t === "sleep") {
          R.mode = "sleep";
          R.mt = 6;
        } else if (a.t === "missions") {
          openMissions();
        } else if (a.t === "craft") {
          openCraft();
        } else if (a.t === "exp") {
          R.leave = 1.4;
          writeSave();
          toast("Cycling the airlock...", 1500);
        }
      }
      function goExpedition() {
        writeSave();
        location.href = "expedition.html";
      }

      function toggleBuild() {
        R.build = !R.build;
        $("bBuild").className = R.build ? "on" : "";
        $("pal").className = R.build ? "on" : "";
        if (R.build) buildPalette();
      }
      function buildPalette() {
        $("pal").innerHTML =
          Object.keys(BLK)
            .map(
              (k) =>
                `<button data-tool="${k}" class="${R.tool === k ? "on" : ""}">${BLK[k].e} ${BLK[k].n}<small>${costTxt(BLK[k].cost)}</small></button>`,
            )
            .join("") +
          Object.keys(MODS)
            .map(
              (k) =>
                `<button data-tool="${k}" class="${R.tool === k ? "on" : ""}">${MODS[k].e} Module: ${MODS[k].n}<small>${costTxt(modCost(MODS[k]))}</small></button>`,
            )
            .join("") +
          `<button data-tool="erase" class="${R.tool === "erase" ? "on" : ""}">🧽 Remove<small>refunds the cost</small></button>`;
      }
      $("pal").onclick = (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        R.tool = b.dataset.tool;
        buildPalette();
      };

      function spawnFault() {
        const F = [
          { k: "power", t: "Power regulator fault", fx: "Lights flicker and the batteries drain." },
          { k: "air", t: "CO₂ scrubber jam", fx: "The air gets stale." },
          { k: "water", t: "Water pump leak", fx: "Water pressure drops." },
        ];
        if (R.fault) return;
        R.fault = F[Math.floor(Math.random() * F.length)];
        R.faultT = rnd(90, 140);
        toast("🔧 FAULT: " + R.fault.t + ". " + R.fault.fx, 5000);
        beep(300, 0.4);
      }
      function startStorm() {
        const total =
          (LIVE.ok ? clamp(150 + (LIVE.speed / 3000) * 450, 150, 600) : 450) *
          0.5 *
          (S.plan && S.plan.storm ? S.plan.storm : 1);
        R.storm = {
          state: 1,
          t: 45,
          total,
          prot: 0,
          drilled: false,
          label: LIVE.ok
            ? `real CME ${LIVE.id} (${Math.round(LIVE.speed)} km/s)`
            : "modeled on the August 1972 storm",
        };
        toast("☢️ NASA space weather alert: " + R.storm.label + ". Arrives in 45 s!", 6000);
        beep(500, 0.3);
      }

      function update(dt) {
        R.t += dt;
        if (R.paused) return;
        const n = S.needs;
        const fm = R.fault ? 2 : 1;
        const sleeping = R.mode === "sleep";
        S.t += dt * (sleeping ? 6 : 1);
        if (missionLeft() <= 0 && !R.timeUp) {
          showTimeUp();
          return;
        }
        n.hunger = Math.max(
          0,
          n.hunger -
            0.5 *
              fm *
              dt *
              (sleeping ? 1.5 : 1) *
              (1.3 - (S.plan ? S.plan.ls : 60) / 200) *
              (S.plan && S.plan.need ? S.plan.need : 1),
        );
        if (sleeping) n.energy = Math.min(100, n.energy + ((70 * bedMult()) / 6) * dt);
        else
          n.energy = Math.max(
            0,
            n.energy -
              0.32 *
                fm *
                dt *
                (mod("gym") ? 1 : 1.3) *
                (1.3 - (S.plan ? S.plan.res : 60) / 200) *
                (S.plan && S.plan.need ? S.plan.need : 1),
          );
        let tgt =
          45 +
          decor() +
          planMood() +
          (n.hunger > 45 ? 12 : n.hunger < 20 ? -25 : 0) +
          (n.energy > 45 ? 12 : n.energy < 20 ? -25 : 0) +
          (R.fault ? -18 : 0) +
          (cnt("window") ? 4 : 0);
        n.mood += (tgt - n.mood) * Math.min(1, 0.06 * dt);
        n.mood = clamp(n.mood, 0, 100);
        if (!(R.fault && R.fault.k === "power")) {
          R.plantAcc += ((cnt("plant") * dt) / 80) * (mod("greenhouse") ? 1.5 : 1);
          while (R.plantAcc >= 1) {
            R.plantAcc -= 1;
            S.rations++;
            toast("🌱 A plant box produced a ration.", 2500);
          }
        }
        S.dose +=
          (GCR / DAYLEN) *
          Math.exp(-shieldVal() / 6) *
          dt *
          (sleeping ? 6 : 1) *
          (mod("med") ? 0.9 : 1) *
          (1.25 - (S.plan ? S.plan.sh : 40) / 200);
        if (S.dose >= DLIM && !R.evac) {
          evacuate();
          return;
        }
        R.petCool = Math.max(0, R.petCool - dt);
        if (!R.fault && S.ch >= 2 && R.storm.state === 0) {
          R.faultT -= dt;
          if (R.faultT <= 0) spawnFault();
        }
        if (!R.storyOpen) {
          if (S.ch === 1 && !R.fault && !(S.flags.repaired >= 1)) spawnFault();
          if (S.ch === 4 && R.storm.state === 0 && !(S.flags.storms >= 1)) startStorm();
        }
        const st = R.storm;
        if (st.state === 1) {
          st.t -= dt;
          if (st.t <= 0) {
            st.state = 2;
            st.t = 15;
            toast("☢️ STORM FRONT ARRIVED!", 3000);
          }
        } else if (st.state === 2) {
          st.t -= dt;
          if (st.t <= 0) {
            const d =
              st.total *
              Math.exp(-shieldVal() / 6) *
              (1 - 0.6 * st.prot) *
              (mod("med") ? 0.9 : 1) *
              (1.25 - (S.plan ? S.plan.sh : 40) / 200);
            S.dose += d;
            S.flags.storms = (S.flags.storms || 0) + 1;
            R.storm = { state: 0, t: 0, total: 0, prot: 0 };
            toast(`The storm passed. Your walls and drill cut it to ${d.toFixed(0)} mSv.`, 6000);
          }
        }
        if (R.leave > 0) {
          R.door = Math.min(1, R.door + dt * 2);
          R.roverX += dt * 40;
          R.leave -= dt;
          if (R.leave <= 0) goExpedition();
        }
        if (R.mode === "walk" || R.mode === "idle" || R.mode === "wave") {
          const dx = R.tx - R.x;
          if (Math.abs(dx) > 3 && R.mode !== "wave") {
            R.x += Math.sign(dx) * Math.min(130 * dt, Math.abs(dx));
            R.dir = dx > 0 ? 1 : -1;
            R.mode = "walk";
          } else if (R.mode === "walk") {
            R.mode = "idle";
            if (R.act) {
              const a = R.act;
              R.act = null;
              arrive(a);
            }
          }
        }
        if (R.mt > 0) {
          R.mt -= dt;
          if (R.mt <= 0) {
            if (R.mode === "eat") {
              n.hunger = Math.min(100, n.hunger + 45);
              n.mood = Math.min(100, n.mood + 3);
              S.flags.ate = true;
            }
            if (R.mode === "sleep") {
              S.flags.slept = true;
              n.mood = Math.min(100, n.mood + 5);
              setBub("Good morning!", 3);
            }
            R.mode = "idle";
          }
        }
        if (R.bubT > 0) R.bubT -= dt;
        else {
          let m = "";
          if (n.hunger < 25) m = "I'm starving! 🍲";
          else if (n.energy < 25) m = "So sleepy... 😴";
          else if (R.fault) m = "Alarm! Something is broken!";
          else if (R.storm.state === 1) m = "A storm is coming!";
          else if (n.mood < 30) m = "I feel down. Pet me?";
          else if (R.t - R.cheerAt > 14) {
            R.cheerAt = R.t;
            m = [
              "What a view of Earth.",
              "Let's build something!",
              "Moon dust everywhere...",
              "Reporting for duty!",
            ][Math.floor(Math.random() * 4)];
          }
          if (m) setBub(m, 3.5);
        }
        R.hearts.forEach((h) => {
          h.y += h.vy * dt;
          h.l -= dt;
        });
        R.hearts = R.hearts.filter((h) => h.l > 0);
        R.toasts.forEach((t) => (t.t -= dt));
        R.toasts = R.toasts.filter((t) => t.t > 0).slice(-3);
        R.lastSave += dt;
        if (R.lastSave > 5) {
          R.lastSave = 0;
          writeSave();
        }
        checkChapter();
      }

      function checkChapter() {
        if (S.ch < 0 || R.storyOpen) return;
        if (S.ch >= CHAPTERS.length) return;
        const c = CHAPTERS[S.ch];
        if (c.ok()) {
          S.units += 60;
          toast("✅ Chapter complete: " + c.t + " (+60 units)", 4000);
          beep(1200, 0.2);
          S.ch++;
          writeSave();
          if (S.ch < CHAPTERS.length) showChapter(S.ch);
          else showEnding();
        }
      }
      function showChapter(i) {
        const c = CHAPTERS[i];
        R.paused = true;
        R.storyOpen = true;
        $("storyBox").innerHTML =
          `<div style="color:var(--mut);font-size:.8em">CHAPTER ${i + 1} OF ${CHAPTERS.length}</div><h2>${c.t}</h2><p>${c.x}</p><div class="real">📡 <b style="color:var(--txt)">Real data:</b> ${c.d}</div><p><b>Goal:</b> ${c.goal}</p><button id="bCh">Continue</button>`;
        $("ovStory").classList.add("on");
        $("bCh").onclick = () => {
          $("ovStory").classList.remove("on");
          R.paused = false;
          R.storyOpen = false;
          if (c.start) c.start();
          writeSave();
        };
      }
      function showEnding() {
        R.paused = true;
        R.storyOpen = true;
        $("storyBox").innerHTML =
          `<h2>🏆 Outpost established!</h2><p>${S.name} did it. The storm is behind you, the base is shielded, solar panels are humming and the antenna is talking to home. Hopper Base is no longer a crash site: it is a place to live.</p><ul><li>📅 Day ${Math.floor(S.t / DAYLEN) + 1}</li><li>🔭 Discoveries: ${S.disc.length}</li><li>☢️ Radiation dose: ${S.dose.toFixed(0)} of ${DLIM} mSv</li><li>🧱 Blocks built: ${Object.keys(S.blocks).length}</li><li>🚀 Expeditions: ${S.exp}</li></ul><div class="real">📡 Every number in this game comes from real NASA data or published mission results. Open Story to see where.</div><button id="bCh">Keep playing</button>`;
        $("ovStory").classList.add("on");
        $("bCh").onclick = () => {
          $("ovStory").classList.remove("on");
          R.paused = false;
          R.storyOpen = false;
        };
      }
      function evacuate() {
        R.evac = true;
        R.paused = true;
        $("endBox").innerHTML =
          `<h2>☢️ ${S.name} was evacuated</h2><p>The radiation dose reached the ${DLIM} mSv limit. Space agencies set limits like this so astronauts stay healthy. More shielding, shorter trips and taking the storm drill seriously would have kept ${S.name} on the Moon.</p><button id="bNew">Start a new mission</button>`;
        $("ovEnd").classList.add("on");
        $("bNew").onclick = () => {
          const keep = {
            name: S.name,
            suit: S.suit,
            visor: S.visor,
            acc: S.acc,
            skin: S.skin,
            hair: S.hair,
            hairCol: S.hairCol,
            eyes: S.eyes,
            outfit: S.outfit,
          };
          S = Object.assign(defSave(), keep, { started: true, ch: -1 });
          writeSave();
          location.reload();
        };
      }

      function openModal(html) {
        R.paused = true;
        $("menuBox").innerHTML = html;
        $("ovMenu").classList.add("on");
      }
      function closeModal() {
        R.newStyle = false;
        $("ovMenu").classList.remove("on");
        R.paused = false;
        writeSave();
      }
      function invHtml() {
        return `<div class="inv">${Object.keys(ITEMS)
          .map(
            (k) =>
              `<span style="border-left:4px solid ${ITEMS[k].c}">${ITEMS[k].n}: <b>${S.inv[k]}</b></span>`,
          )
          .join("")}<span>🍲 ${S.rations}</span><span>◈ ${S.units}</span></div>`;
      }
      function head(title) {
        return `<div style="display:flex;justify-content:space-between;align-items:center"><h2>${title}</h2><button class="alt" data-m="close">✕ Close</button></div>`;
      }

      function openMissions() {
        const f = R.fault;
        const st = R.storm;
        openModal(
          head("🎯 Mission board") +

      mg.addEventListener("pointermove", (e) => {
        if (MG && MG.kind === "storm" && !MG.res) {
          MG.tx = mgPos(e).x;
        }
      });
      function plantBoost(i) {
        if (MG.cd[i] > 0) return;
        MG.m[i] = Math.min(100, MG.m[i] + 24);
        MG.cd[i] = 0.15;
        beep(700 + i * 150, 0.05);
      }
      window.addEventListener("keydown", (e) => {
        if (!MG) return;
        const k = e.key.toLowerCase();
        MG.keys[k] = true;
        if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(k))
          e.preventDefault();
        if (MG.kind === "plant" && ["1", "2", "3"].includes(k)) plantBoost(+k - 1);
        if (MG.kind === "maze") {
          const m = {
            arrowup: "u",
            arrowdown: "d",
            arrowleft: "l",
            arrowright: "r",
            w: "u",
            s: "d",
            a: "l",
            d: "r",
          }[k];
          if (m) MG.dir = m;
        }
      });
      window.addEventListener("keyup", (e) => {
        if (!MG) return;
        const k = e.key.toLowerCase();
        MG.keys[k] = false;
        if (MG.kind === "maze") {
          const m = {
            arrowup: "u",
            arrowdown: "d",
            arrowleft: "l",
            arrowright: "r",
            w: "u",
            s: "d",
            a: "l",
            d: "r",
          }[k];
          if (m && MG.dir === m) MG.dir = null;
        }
      });

      function mgUpdate(dt) {
        if (!MG) return;
        if (MG.res) {
          MG.rt += dt;
          if (MG.rt > 2.4) applyMG();
          return;
        }
        MG.t += dt;
        const left = MG.max - MG.t;
        if (MG.kind === "wires") {
          MG.flash = Math.max(0, MG.flash - dt);
          if (left <= 0) finishMG(false);
        } else if (MG.kind === "plant") {
          for (let i = 0; i < 3; i++) {
            MG.m[i] = Math.max(0, MG.m[i] - [7, 5, 9][i] * dt);
            MG.cd[i] = Math.max(0, MG.cd[i] - dt);
          }
          const ok = MG.m.every((v) => v >= 35 && v <= 88);
          MG.growth = clamp(MG.growth + (ok ? 4.2 : -1.6) * dt, 0, 100);
          if (left <= 0) {
            const n = MG.growth >= 85 ? 3 : MG.growth >= 55 ? 2 : MG.growth >= 25 ? 1 : 0;
            finishMG(n > 0, n);
          }
        } else if (MG.kind === "storm") {
          if (MG.keys.arrowleft || MG.keys.a) MG.tx -= 420 * dt;
          if (MG.keys.arrowright || MG.keys.d) MG.tx += 420 * dt;
          MG.tx = clamp(MG.tx, 70, 570);
          MG.sx += (MG.tx - MG.sx) * Math.min(1, 12 * dt);
          MG.sp -= dt;
          if (MG.sp <= 0 && left > 1.5) {
            MG.parts.push({ x: rnd(40, 600), y: -10, v: 150 + MG.t * 7 });
            MG.total++;
            MG.sp = 0.42 - MG.t * 0.008;
          }
          MG.parts.forEach((p) => {
            p.y += p.v * dt;
          });
          MG.parts = MG.parts.filter((p) => {
            if (p.y > 318 && p.y < 334 && Math.abs(p.x - MG.sx) < 68) {
              MG.blocked++;
              beep(1000, 0.03, 0.02);
              return false;
            }
            if (p.y > 372) {
              MG.hit++;
              return false;
            }
            return true;
          });
          if (left <= 0) finishMG(true, MG.total ? MG.blocked / MG.total : 0);
        } else {
          MG.mt += dt;
          while (MG.mt >= 0.11) {
            MG.mt -= 0.11;
            if (MG.dir) {
              const d = { u: [0, -1], d: [0, 1], l: [-1, 0], r: [1, 0] }[MG.dir];
              const nx = MG.x + d[0],
                ny = MG.y + d[1];
              if (MG.g[ny] && MG.g[ny][nx] === 0) {
                MG.x = nx;
                MG.y = ny;
                const k = nx + "," + ny;
                if (MG.items[k]) {
                  MG.got[MG.items[k]]++;
                  delete MG.items[k];
                  beep(900, 0.05);
                }
              }
            }
          }
          if (left <= 0 || !Object.keys(MG.items).length) finishMG(true, MG.got);
        }
      }
      function mgDraw(t) {
        if (!MG) return;
        mc.fillStyle = "#0a0e2a";
        mc.fillRect(0, 0, 640, 420);
        const left = Math.max(0, MG.max - MG.t);
        mc.fillStyle = "#fff";
        mc.font = "bold 14px sans-serif";
        mc.textAlign = "left";
        mc.fillText("⏱️ " + left.toFixed(0) + " s", 10, 20);
        if (MG.kind === "wires") {
          if (MG.flash > 0) {
            mc.fillStyle = "rgba(255,60,60,.2)";
            mc.fillRect(0, 0, 640, 420);
          }
          for (let i = 0; i < 5; i++) {
            const y = 60 + i * 66;
            mc.fillStyle = WIRE[i];
            mc.beginPath();
            mc.arc(90, y, 18, 0, 7);
            mc.fill();
            if (MG.sel === i) {
              mc.strokeStyle = "#fff";
              mc.lineWidth = 4;
              mc.stroke();
            }
            mc.fillStyle = WIRE[MG.right[i]];
            mc.beginPath();
            mc.arc(550, y, 18, 0, 7);
            mc.fill();
          }
          MG.con.forEach((ri, i) => {
            if (ri === undefined) return;
            mc.strokeStyle = WIRE[i];
            mc.lineWidth = 8;
            mc.beginPath();
            mc.moveTo(108, 60 + i * 66);
            mc.bezierCurveTo(300, 60 + i * 66, 340, 60 + ri * 66, 532, 60 + ri * 66);
            mc.stroke();
          });
        } else if (MG.kind === "plant") {
          const N = ["💧 Water", "💡 Light", "🧪 Nutrients"],
            C = ["#5aa9ff", "#ffd166", "#7bd88f"];
          for (let i = 0; i < 3; i++) {
            const x = 60 + i * 190;
            mc.fillStyle = "#12183f";
            mc.fillRect(x, 50, 170, 260);
            mc.fillStyle = "rgba(123,216,143,.2)";
            mc.fillRect(x, 50 + 260 * (1 - 0.88), 170, 260 * 0.53);
            mc.fillStyle = C[i];
            mc.fillRect(x + 30, 50 + 260 * (1 - MG.m[i] / 100), 110, (260 * MG.m[i]) / 100);
            mc.fillStyle = "#fff";
            mc.textAlign = "center";
            mc.fillText(N[i] + " (" + (i + 1) + ")", x + 85, 40);
            mc.fillStyle = MG.cd[i] > 0 ? "#555b7a" : "#ff9f45";
            mc.fillRect(x, 330, 170, 70);
            mc.fillStyle = "#1b1200";
            mc.font = "bold 18px sans-serif";
            mc.fillText("Boost", x + 85, 372);
            mc.font = "bold 14px sans-serif";
          }
          mc.fillStyle = "#12183f";
          mc.fillRect(200, 8, 240, 14);
          mc.fillStyle = "#7bd88f";
          mc.fillRect(200, 8, (240 * MG.growth) / 100, 14);
          mc.fillStyle = "#fff";
          mc.textAlign = "center";
          mc.fillText("🌱 growth", 320, 20);
        } else if (MG.kind === "storm") {
          mc.fillStyle = "rgba(255,150,30,.08)";
          mc.fillRect(0, 0, 640, 420);
          MG.parts.forEach((p) => {
            mc.fillStyle = "#ffd166";
            mc.beginPath();
            mc.arc(p.x, p.y, 6, 0, 7);
            mc.fill();
            mc.strokeStyle = "rgba(255,210,90,.5)";
            mc.lineWidth = 2;
            mc.beginPath();
            mc.moveTo(p.x, p.y);
            mc.lineTo(p.x - 3, p.y - 20);
            mc.stroke();
          });
          mc.fillStyle = "#7b4fd0";
          mc.beginPath();
          mc.roundRect(MG.sx - 68, 318, 136, 16, 8);
          mc.fill();
          mc.fillStyle = "#e8dcff";
          mc.font = "bold 12px sans-serif";
          mc.textAlign = "center";
          mc.fillText("H  H  H", MG.sx, 330);
          drawMira(mc, 320, 414, 0.62, { mode: "idle", dir: 1 });
          mc.textAlign = "left";
          mc.fillStyle = "#fff";
          mc.font = "bold 14px sans-serif";
          mc.fillText(`blocked ${MG.blocked} · hit ${MG.hit}`, 500, 20);
        } else {
          const MS = 26,
            ox = 47,
            oy = 15;
          for (let y = 0; y < 15; y++)
            for (let x = 0; x < 21; x++) {
              mc.fillStyle = MG.g[y][x] ? "#4a4f78" : "#b9bdd0";
              mc.fillRect(ox + x * MS, oy + y * MS, MS, MS);
            }
          mc.font = "18px serif";
          mc.textAlign = "center";
          mc.textBaseline = "middle";
          Object.keys(MG.items).forEach((k) => {
            const [x, y] = k.split(",").map(Number);
            mc.fillText(
              MG.items[k] === "ice" ? "🧊" : MG.items[k] === "ilmenite" ? "🔶" : "🪨",
              ox + x * MS + MS / 2,
              oy + y * MS + MS / 2,
            );
          });
          mc.font = "22px serif";
          mc.fillText("🚙", ox + MG.x * MS + MS / 2, oy + MG.y * MS + MS / 2);
          mc.textBaseline = "alphabetic";
        }
        if (MG.res) {
          mc.fillStyle = "rgba(0,0,0,.65)";
          mc.fillRect(0, 150, 640, 120);
          mc.fillStyle = MG.res.ok ? "#7bd88f" : "#ff5d73";
          mc.font = "bold 28px sans-serif";
          mc.textAlign = "center";
          mc.fillText(MG.res.ok ? "Success!" : "Time's up!", 320, 215);
        }
        mc.textAlign = "left";
      }

      let last = 0,
        hudT = 0;
      function updateHud(dt) {
        hudT += dt;
        if (hudT < 0.1) return;
        hudT = 0;
        const n = S.needs;
        const bar = (l, v, c, low) =>
          `<div class="bar ${low ? "low" : ""}"><b><span>${l}</span><span>${Math.round(v)}</span></b><div class="bt"><i style="width:${v}%;background:${c}"></i></div></div>`;
        $("bars").innerHTML =
          bar("🍲 Hunger", n.hunger, "#7bd88f", n.hunger < 25) +
          bar("⚡ Energy", n.energy, "#ffd166", n.energy < 25) +
          bar("💛 Mood", n.mood, "#ff7aa8", n.mood < 30) +
          `<div style="font-size:.9em">☢️ Dose <b>${S.dose.toFixed(1)}</b> / ${DLIM} mSv · 🛡️ Shield ${shieldVal().toFixed(1)}</div>`;
        const c = CHAPTERS[S.ch];
        $("info").innerHTML =
          `<small>PHASE 2 · LUNAR BASE · ${(S.plan ? LEVELS[S.plan.level] || lvNow() : lvNow()).n.toUpperCase()} LEVEL</small><br><b>${S.name}</b> · Day ${Math.floor(S.t / DAYLEN) + 1} · ⏳ ${Math.max(0, missionLeft() / DAYLEN).toFixed(1)}d left · ◈ ${S.units} · 🍲 ${S.rations}<br>${c ? `<small>CHAPTER ${S.ch + 1}: ${c.t}</small><br>${c.goal}` : S.ch >= CHAPTERS.length ? "<small>Outpost established. Keep building!</small>" : "<small>Plan your mission</small>"}<br><small>🏠 ${Object.keys(S.blocks).length} blocks: −${sizePenalty().toFixed(1)} days of mission time</small>`;
        let b = "";
        if (R.fault)
          b += `<div class="wc">🔧 FAULT: ${R.fault.t} <button data-b="wires">Repair</button></div>`;
        const st = R.storm;
        if (st.state === 1)
          b += `<div class="wc">☢️ STORM IN ${Math.ceil(st.t)} s <button data-b="storm">Shield drill</button></div>`;
        if (st.state === 2)
          b += `<div class="wc">☢️ STORM ACTIVE ${Math.ceil(st.t)} s${st.drilled ? "" : ' <button data-b="storm">Shield drill</button>'}</div>`;
        if (n.hunger < 20) b += `<div class="ww">🍲 ${S.name} is starving</div>`;
        if (n.energy < 15) b += `<div class="ww">😴 ${S.name} is exhausted</div>`;
        if ($("banners").dataset.h !== b) {
          $("banners").innerHTML = b;
          $("banners").dataset.h = b;
        }
        $("toast").innerHTML = R.toasts.map((t) => `<div>${t.m}</div>`).join("");
      }
      $("banners").onclick = (e) => {
        const b = e.target.closest("button");
        if (b && !R.paused) {
          startMG(b.dataset.b);
        }
      };

      function loop(ts) {
        const dt = Math.min(0.05, (ts - last) / 1000) * A.speed;
        last = ts;
        update(dt);
        mgUpdate(dt);
        drawHub(ts);
        if ($("prev")) drawPrev();
        if (MG) mgDraw(ts);
        updateHud(dt);
        requestAnimationFrame(loop);
      }

      $("bar").onclick = (e) => {
        const b = e.target.closest("button");
        if (b) doAct(b.dataset.a);
      };
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) writeSave();
      });
      window.addEventListener("beforeunload", writeSave);

      function showTitle() {
        const has = S.started;
        $("titleBox").innerHTML =
          `<h2>🌙 Lunar Base Junior</h2><p>A life-sim on the Moon. Create your astronaut, plan the mission, fly to the Moon, and look after your crew at Hopper Base near the lunar south pole, where NASA plans to land humans with Artemis.</p><ul><li>🎨 Design your astronaut: name, skin, hair, outfit.</li><li>🚀 Plan the ship: every extra module adds weight, travel time and risk.</li><li>🍲😴💛 Keep your astronaut fed, rested and happy.</li><li>🧱 Build and decorate the base block by block.</li><li>🎯 Play repair, plant care, storm and maze missions, and explore the surface.</li><li>📡 Face real NASA space weather and learn the real science behind it.</li></ul>${has ? `<button id="bCont">▶ Continue as ${S.name}</button> ` : ""}<button id="bNew" class="${has ? "alt" : ""}">New game</button>`;
        if (has)
          $("bCont").onclick = () => {
            $("ovTitle").classList.remove("on");
            ensureAudio();
            R.paused = false;
            if (!S.planned && !S.plan && S.ch < 0) {
              openPlan();
              return;
            }
            if (S.ch === 0 && !S.flags.intro) {
              S.flags.intro = 1;
              showChapter(0);
            }
          };
        $("bNew").onclick = () => {
          if (has && !confirm("Start over? Your current base will be lost.")) return;
          const keep = has
            ? {
                name: S.name,
                suit: S.suit,
                visor: S.visor,
                acc: S.acc,
                skin: S.skin,
                hair: S.hair,
                hairCol: S.hairCol,
                eyes: S.eyes,
                outfit: S.outfit,
              }
            : {};
          S = Object.assign(defSave(), keep);
          S.started = true;
          PL = null;
          $("ovTitle").classList.remove("on");
          ensureAudio();
          R.newStyle = true;
          openStyle();
        };
      }
      function reportExp() {
        const e = S.lastExp;
        if (!e) return;
        S.lastExp = null;
        toast(
          `🚀 Expedition complete: ${e.items} items, ${e.units} units, ${e.disc} new discoveries.`,
          6000,
        );
        writeSave();
      }
      if (S.started && S.lastExp && !S.evac) {
        $("ovTitle").classList.remove("on");
        R.paused = false;
        reportExp();
      } else showTitle();
      if (S.started && S.evac) {
        S.evac = false;
        evacuate();
      }

      async function loadDonki() {
        try {
          const end = new Date(),
            start = new Date(Date.now() - 30 * 864e5);
          const f = (x) => x.toISOString().slice(0, 10);
          const r = await fetch(
            `https://api.nasa.gov/DONKI/CME?startDate=${f(start)}&endDate=${f(end)}&api_key=${APIKEY}`,
          );
          if (!r.ok) throw new Error("x");
          const j = await r.json();
          const list = j
            .map((e) => {
              const a = e.cmeAnalyses && e.cmeAnalyses[0];
              return a && a.speed ? { id: e.activityID, speed: a.speed, t: e.startTime } : null;
            })
            .filter(Boolean);
          if (!list.length) throw new Error("x");
          const best = list.reduce((a, b) => (b.speed > a.speed ? b : a));
          LIVE.ok = true;
          LIVE.id = best.id;
          LIVE.speed = best.speed;
          LIVE.cmes = list
            .slice()
            .sort((a, b) => b.speed - a.speed)
            .slice(0, 6);
        } catch (e) {
          LIVE.ok = false;
        }
      }

      function openA11y() {
        const tg = (k, label, desc) =>
          `<div class="row"><div><b>${label}</b><small>${desc}</small></div><button data-ax="${k}" aria-pressed="${!!A[k]}" class="${A[k] ? "on" : "alt"}">${A[k] ? "ON" : "OFF"}</button></div>`;
        openModal(
          head("♿ Accessibility") +
            `<div class="row"><div><b>Game speed</b><small>Slows everything down, including timers and minigames. Take your time.</small></div><div>${[
              0.5, 0.75, 1,
            ]
              .map(
                (v) =>
                  `<button data-ax="speed" data-v="${v}" aria-pressed="${A.speed === v}" class="${A.speed === v ? "on" : "alt"}">${v}×</button>`,
              )
              .join(" ")}</div></div>` +
            `<div class="row"><div><b>Volume</b><small>Zero is silent.</small></div><input type="range" id="volr" min="0" max="1" step="0.1" value="${A.vol}" aria-label="Volume"></div>` +
            tg("rm", "Reduce motion", "Fewer flashes, no storm streaks, calmer animations.") +
            tg("hc", "High contrast", "Stronger borders and colors.") +
            tg("big", "Large text", "Bigger text everywhere.") +
            tg("cap", "Sound captions", "Show text for important sounds, like alarms.") +
            tg(
              "toggleMine",
              "Toggle mining (expedition)",
              "Click once to start the mining beam and again to stop, instead of holding.",
            ) +
            `<div class="real">Keyboard: Tab and Shift+Tab move between buttons, Enter or Space activates, Esc closes menus. Shortcuts at the base: E eat, Z sleep, P pet, M missions, C craft, B build, S style, X expedition, W space weather, A accessibility. Important events are announced to screen readers. These settings are shared with the expedition and saved in this browser.</div>`,
        );
        $("volr").oninput = (e) => {
          A.vol = +e.target.value;
          saveA();
        };
      }
      window.addEventListener("keydown", (e) => {
        const tag = (e.target && e.target.tagName) || "";
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
        const k = e.key.toLowerCase();
        if (k === "escape" && $("ovMenu").classList.contains("on")) {
          closeModal();
          return;
        }
        if (
          (k === "enter" || k === " ") &&
          e.target &&
          e.target.classList &&
          e.target.classList.contains("pc")
        ) {
          e.preventDefault();
          e.target.click();
          return;
        }
        if (
          (k === "enter" || k === " ") &&
          e.target &&
          e.target.classList &&
          e.target.classList.contains("sw")
        ) {
          e.preventDefault();
          e.target.click();
          return;
        }
        if (R.paused || MG || e.ctrlKey || e.metaKey || e.altKey) return;
        const map = {
          e: "eat",
          z: "sleep",
          p: "pet",
          m: "missions",
          c: "craft",
          b: "build",
          s: "style",
          x: "exp",
          w: "wx",
          a: "a11y",
        };
        if (map[k]) {
          e.preventDefault();
          doAct(map[k]);
        }
      });
      document.querySelectorAll(".overlay").forEach((o) => {
        o.setAttribute("role", "dialog");
        o.setAttribute("aria-modal", "true");
        new MutationObserver(() => {
          if (o.classList.contains("on")) {
            setTimeout(() => {
              const b = o.querySelector("button,input");
              if (b) b.focus();
              const h = o.querySelector("h2");
              if (h) announce(h.textContent);
            }, 60);
          }
        }).observe(o, { attributes: true, attributeFilter: ["class"] });
      });
      async function loadTech() {
        try {
          const raw = localStorage.getItem("lbj_tech");
          if (raw) {
            const o = JSON.parse(raw);
            if (Date.now() - o.at < 12 * 3600 * 1000 && o.items.length) {
              LIVE.tech = o.items;
              return;
            }
          }
        } catch (e) {}
        try {
          const since = new Date(Date.now() - 14 * 864e5).toISOString().slice(0, 10);
          const r = await fetch(
            "https://api.nasa.gov/techport/api/projects?updatedSince=" +
              since +
              "&api_key=" +
              APIKEY,
          );
          if (!r.ok) return;
          const j = await r.json();
          const ids = j.projects
            .map((p) => p.projectId)
            .sort(() => Math.random() - 0.5)
            .slice(0, 8);
          const items = [];
          for (const id of ids) {
            if (items.length >= 3) break;
            const d = await fetch(
              "https://api.nasa.gov/techport/api/projects/" + id + "?api_key=" + APIKEY,
            );
            if (!d.ok) continue;
            const p = (await d.json()).project;
            if (!p || !p.title) continue;
            items.push({
              id: p.projectId,
              title: p.title,
              org: p.leadOrganization && p.leadOrganization.organizationName,
              trl: p.trlCurrent,
            });
          }
          LIVE.tech = items;
          localStorage.setItem("lbj_tech", JSON.stringify({ at: Date.now(), items }));
          if (PL && $("ovPlan").classList.contains("on")) renderPlan();
        } catch (e) {}
      }
      function techBox() {
        if (!LIVE.tech || !LIVE.tech.length) return "";
        return `<div class="real">🛰️ <b style="color:var(--txt)">Real NASA technology in development (TechPort):</b><br>${LIVE.tech
          .map(
            (t) =>
              `• ${String(t.title).replace(/</g, "&lt;")}${t.org ? " · " + t.org : ""}${t.trl ? " · TRL " + t.trl : ""}`,
          )
          .join(
            "<br>",
          )}<br><small>Real projects updated in the last two weeks. Space agencies test technologies like these for life support, shielding and power.</small></div>`;
      }
      applyLevel();
      loadDonki();
      loadWx();
      loadTech();
      requestAnimationFrame(loop);
    </script>
  </body>
