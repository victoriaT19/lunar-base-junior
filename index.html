<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <title>Lunar Base Junior</title>
    <link rel="stylesheet" href="css/style.css?v=19" />
  </head>
  <body>
    <div id="wrap">
      <div id="stage">
        <canvas id="cv" width="1920" height="1080"></canvas>
        <div class="hud" id="bars"></div>
        <div class="hud" id="info"></div>
        <div class="hud" id="banners"></div>
        <div class="hud" id="toast"></div>
        <div id="pal"></div>
        <div id="bar">
          <div class="bmain">
            <button data-a="eat"><i aria-hidden="true">🍲</i><span>Eat</span></button>
            <button data-a="sleep"><i aria-hidden="true">😴</i><span>Sleep</span></button>
            <button data-a="pet"><i aria-hidden="true">🤖</i><span>Hi KAI</span></button>
            <button data-a="missions"><i aria-hidden="true">🎯</i><span>Missions</span></button>
            <button data-a="craft"><i aria-hidden="true">🔧</i><span>Craft</span></button>
            <button data-a="build" id="bBuild">
              <i aria-hidden="true">🧱</i><span>Build</span>
            </button>
            <button data-a="exp"><i aria-hidden="true">🚀</i><span>Go out</span></button>
          </div>
          <div class="bside">
            <button data-a="style" title="Change your look" aria-label="Change your look">
              🎨
            </button>
            <button data-a="story" title="Story" aria-label="Story">📖</button>
            <button data-a="wx" title="Space weather" aria-label="Space weather">📡</button>
            <button data-a="a11y" title="Accessibility" aria-label="Accessibility settings">
              ♿
            </button>
            <button data-a="snd" id="bSnd" title="Sound" aria-label="Toggle sound">🔊</button>
          </div>
        </div>

        <div id="sr" class="sr-only" aria-live="polite" aria-atomic="true"></div>
        <div class="overlay on" id="ovTitle"><div class="modal" id="titleBox"></div></div>
        <div class="overlay" id="ovPlan"><div class="modal" id="planBox"></div></div>
        <div class="overlay" id="ovMenu"><div class="modal" id="menuBox"></div></div>
        <div class="overlay" id="ovStory"><div class="modal" id="storyBox"></div></div>
        <div class="overlay" id="ovMG">
          <div id="mgBox">
            <div
              style="
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 6px;
              "
            >
              <b id="mgTitle"></b
              ><span
                ><button
                  class="alt"
                  id="mgKai"
                  title="KAI finishes the task, but uses half of your oxygen"
                >
                  🤖 KAI helps (½ oxygen)
                </button>
                <button class="alt" id="mgQuit">Give up</button></span
              >
            </div>
            <canvas id="mg" width="1280" height="840"></canvas>
            <div id="mgHelp" style="color: var(--mut); font-size: 0.85em; margin-top: 6px"></div>
          </div>
        </div>
        <div class="overlay" id="ovEnd"><div class="modal" id="endBox"></div></div>
      </div>
    </div>

    <script src="art/art.js?v=2"></script>
    <script src="js/core.js?v=19"></script>
    <script src="js/data.js?v=19"></script>
    <script src="js/state.js?v=19"></script>
    <script src="js/character.js?v=19"></script>
    <script src="js/hub.js?v=19"></script>
    <script src="js/ui.js?v=19"></script>
    <script src="js/plan.js?v=19"></script>
    <script src="js/minigames.js?v=19"></script>
    <script src="js/mission.js?v=19"></script>
    <script src="js/room.js?v=19"></script>
    <script src="js/main.js?v=19"></script>
  </body>
</html>
